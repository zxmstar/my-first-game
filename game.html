<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>怒冲鸟 · Slingshot Lab</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07111e;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.hud{position:fixed;z-index:2;top:14px;left:50%;transform:translateX(-50%);width:min(1100px,calc(100% - 24px));display:flex;justify-content:space-between;gap:10px;pointer-events:none}.box{background:#081425aa;border:1px solid #ffffff1c;backdrop-filter:blur(15px);border-radius:16px;padding:9px 13px;box-shadow:0 10px 35px #0004}.brand b{font-size:15px}.brand small{display:block;color:#8ea3b9;font-size:10px}.stats{display:flex;gap:7px}.stats .box{text-align:center;min-width:62px}.stats small{display:block;color:#8ea3b9;font-size:9px}.stats b{font-size:15px}.actions{position:fixed;z-index:3;right:14px;bottom:14px;display:flex;gap:7px}.btn{border:1px solid #ffffff1c;background:#081425cc;color:#e8f2ff;border-radius:13px;padding:10px 13px;font-weight:800}.modal{position:fixed;z-index:5;inset:0;display:none;place-items:center;background:#02071199;backdrop-filter:blur(8px)}.modal.on{display:grid}.card{width:min(420px,calc(100% - 28px));padding:28px;border-radius:27px;background:#0d1b2eF5;border:1px solid #ffffff20;text-align:center;box-shadow:0 30px 100px #0008}.card h1{margin:7px 0;font-size:29px}.card p{color:#9fb2c8}.stars{font-size:26px;color:#ffd15c;letter-spacing:5px}.primary{width:100%;padding:13px;border:0;border-radius:14px;background:#ffd15c;font-weight:900;font-size:15px}</style><div class="hud"><div class="box brand"><b>⚡ 怒冲鸟 · SLINGSHOT LAB</b><small>原创弹射物理游戏 · 拖拽发射</small></div><div class="stats"><div class="box"><small>关卡</small><b id="lv">1</b></div><div class="box"><small>分数</small><b id="sc">0</b></div><div class="box"><small>弹药</small><b id="am">4</b></div></div></div><canvas id="c"></canvas><div class="actions"><button class="btn" id="reset">↻ 重来</button><button class="btn" id="snd">🔊 音效</button></div><div class="modal" id="modal"><div class="card"><div class="stars" id="stars">★★★</div><h1 id="mt">清场！</h1><p id="mp"></p><button class="primary" id="go">下一关 →</button></div></div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),lv=document.querySelector('#lv'),sc=document.querySelector('#sc'),am=document.querySelector('#am'),modal=document.querySelector('#modal'),mt=document.querySelector('#mt'),mp=document.querySelector('#mp'),stars=document.querySelector('#stars');let W,H,D,level=1,score=0,ammo=4,bird=null,drag=false,mx=0,my=0,blocks=[],pigs=[],bits=[],shake=0,sound=true,done=false;
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
const plans=[[[.69,.67,.18,.06,1],[.82,.58,.06,.17,2],[.92,.68,.06,.13,1],[.77,.47,.06,.14,2]],[[.66,.70,.19,.06,2],[.75,.58,.06,.22,1],[.87,.70,.18,.06,1],[.94,.57,.06,.19,2],[.84,.45,.14,.06,2]],[[.62,.71,.14,.06,1],[.72,.61,.06,.25,2],[.84,.71,.22,.06,2],[.94,.61,.06,.25,1],[.82,.48,.17,.06,2],[.88,.39,.06,.13,1]]];
function gy(){return H-Math.max(62,H*.13)}function sl(){return{x:W*.18,y:gy()-96}}function init(){blocks=[];pigs=[];bits=[];bird=null;ammo=4;done=false;modal.classList.remove('on');am.textContent=ammo;lv.textContent=level;let p=plans[(level-1)%plans.length];p.forEach(a=>blocks.push({x:a[0]*W,y:gy()-a[1]*H,w:a[2]*W,h:a[3]*H,hp:a[4],max:a[4],dead:0}));let n=level+1;for(let i=0;i<n;i++){let q=p[i%p.length];pigs.push({x:(q[0]+(i%2?-.035:.035))*W,y:gy()-(q[1]+.055)*H,r:Math.max(12,W*.018),dead:0})}}
function tone(f=220,t=.06){if(!sound)return;try{let a=window.ac||(window.ac=new AudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.04;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+t)}catch(e){}}
function burst(X,Y,n=18){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=1+Math.random()*5;bits.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2,l:1,r:2+Math.random()*3})}}
function hitRect(X,Y,r,b){let px=Math.max(b.x-b.w/2,Math.min(X,b.x+b.w/2)),py=Math.max(b.y-b.h/2,Math.min(Y,b.y+b.h/2));return (X-px)**2+(Y-py)**2<r*r}
function fire(){if(!drag||ammo<1||bird)return;let s=sl(),dx=s.x-mx,dy=s.y-my,L=Math.hypot(dx,dy),k=Math.min(L,160)/160;bird={x:s.x,y:s.y,vx:dx/(L||1)*k*15,vy:dy/(L||1)*k*15,r:19,trail:[],rest:0};ammo--;am.textContent=ammo;drag=false;tone(140,.12)}
function collide(){for(let b of blocks)if(!b.dead&&hitRect(bird.x,bird.y,bird.r,b)){let v=Math.hypot(bird.vx,bird.vy);b.hp-=v>7?2:1;bird.vx*=-.52;bird.vy*=-.52;score+=Math.round(v*8);burst(bird.x,bird.y,8);shake=Math.min(14,v*.4);tone(100+v*8,.06);if(b.hp<=0){b.dead=1;score+=250;burst(b.x,b.y,28);shake=16;tone(70,.15)}}for(let p of pigs)if(!p.dead&&Math.hypot(bird.x-p.x,bird.y-p.y)<bird.r+p.r){p.dead=1;score+=600;burst(p.x,p.y,35);shake=18;tone(430,.14)}}
function update(){if(done)return;if(bird){bird.trail.push({x:bird.x,y:bird.y});if(bird.trail.length>22)bird.trail.shift();bird.vy+=.42;bird.vx+=(level%2?0.018:-0.012);bird.x+=bird.vx;bird.y+=bird.vy;bird.vx*=.997;bird.vy*=.998;collide();if(bird.y+bird.r>gy()){bird.y=gy()-bird.r;bird.vy*=-.43;bird.vx*=.72;bird.rest++}if(bird.x>W+80||bird.y>H+100||bird.rest>42||Math.hypot(bird.vx,bird.vy)<.45&&bird.rest>9){bird=null;if(ammo===0)setTimeout(lose,650)}}for(let q of bits){q.x+=q.vx;q.y+=q.vy;q.vy+=.13;q.l-=.025}bits=bits.filter(q=>q.l>0);shake*=.86;sc.textContent=score;if(pigs.length&&pigs.every(p=>p.dead))win()}
function win(){if(done)return;done=true;stars.textContent=ammo>=2?'★★★':ammo===1?'★★☆':'★☆☆';mt.textContent='完美清场！';mp.textContent='本关得分 '+score.toLocaleString()+' · 剩余弹药 '+ammo;setTimeout(()=>modal.classList.add('on'),400)}function lose(){if(done||pigs.every(p=>p.dead))return;done=true;stars.textContent='—';mt.textContent='弹药耗尽';mp.textContent='别急，重来一次，换个角度和力度。';modal.classList.add('on')}
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r);x.fill();x.stroke()}function birdDraw(X,Y,r){x.save();x.translate(X,Y);let a=bird?Math.atan2(bird.vy,bird.vx):0;x.rotate(Math.max(-.45,Math.min(.45,a)));x.fillStyle='#ff5d4f';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.fillStyle='#ffe8d4';x.beginPath();x.arc(0,r*.38,r*.56,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(-r*.34,-r*.2,r*.24,r*.31,0,0,7);x.ellipse(r*.34,-r*.2,r*.24,r*.31,0,0,7);x.fill();x.fillStyle='#172033';x.beginPath();x.arc(-r*.34,-r*.18,r*.09,0,7);x.arc(r*.34,-r*.18,r*.09,0,7);x.fill();x.fillStyle='#ffc247';x.beginPath();x.moveTo(-2,-2);x.lineTo(r*.55,3);x.lineTo(-2,8);x.fill();x.strokeStyle='#321d20';x.lineWidth=4;x.beginPath();x.moveTo(-r*.6,-r*.47);x.lineTo(-r*.08,-r*.37);x.moveTo(r*.08,-r*.37);x.lineTo(r*.6,-r*.47);x.stroke();x.restore()}
function draw(){x.clearRect(0,0,W,H);let sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;x.save();x.translate(sx,sy);let G=x.createLinearGradient(0,0,0,gy());G.addColorStop(0,'#142d49');G.addColorStop(1,'#0a1728');x.fillStyle=G;x.fillRect(0,0,W,gy());x.fillStyle='#102d31';x.fillRect(0,gy(),W,H-gy());x.fillStyle='#ffffff10';x.beginPath();x.arc(W*.82,H*.16,40,0,7);x.fill();let s=sl();x.strokeStyle='#7a4a2a';x.lineWidth=7;x.lineCap='round';x.beginPath();x.moveTo(s.x-12,gy());x.lineTo(s.x-4,s.y-7);x.moveTo(s.x+14,gy());x.lineTo(s.x+4,s.y-7);x.stroke();if(drag){x.strokeStyle='#c9854c';x.beginPath();x.moveTo(s.x-4,s.y-7);x.lineTo(mx,my);x.lineTo(s.x+4,s.y-7);x.stroke();for(let i=1;i<10;i++){let t=i*.1,k=Math.min(Math.hypot(s.x-mx,s.y-my),160)/160,vx=(s.x-mx)*k*15,vy=(s.y-my)*k*15;x.fillStyle='#fff8';x.beginPath();x.arc(s.x+vx*t,s.y+vy*t+.21*t*t*60,2.4,0,7);x.fill()}}for(let b of blocks)if(!b.dead){x.save();x.translate(b.x,b.y);x.fillStyle=b.max===2?'#895a3e':'#a66d43';rr(-b.w/2,-b.h/2,b.w,b.h,9);x.restore()}for(let p of pigs)if(!p.dead){x.fillStyle='#9ce05d';x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();x.fillStyle='#17210e';x.beginPath();x.arc(p.x-p.r*.32,p.y-p.r*.12,p.r*.11,0,7);x.arc(p.x+p.r*.32,p.y-p.r*.12,p.r*.11,0,7);x.fill()}if(bird){for(let i=0;i<bird.trail.length;i++){let q=bird.trail[i];x.fillStyle='rgba(255,205,85,'+(i/bird.trail.length*.3)+')';x.beginPath();x.arc(q.x,q.y,3,0,7);x.fill()}birdDraw(bird.x,bird.y,bird.r)}else if(ammo)birdDraw(s.x,s.y,19);for(let q of bits){x.globalAlpha=q.l;x.fillStyle='#ffd15c';x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill();x.globalAlpha=1}x.restore();update();requestAnimationFrame(draw)}
function pointer(e){mx=e.clientX;my=e.clientY}c.onpointerdown=e=>{pointer(e);let s=sl();if(!bird&&ammo&&Math.hypot(mx-s.x,my-s.y)<58)drag=true};c.onpointermove=e=>{if(!drag)return;pointer(e);let s=sl(),dx=mx-s.x,dy=my-s.y,L=Math.hypot(dx,dy);if(L>160){mx=s.x+dx/L*160;my=s.y+dy/L*160}};c.onpointerup=()=>fire();c.onpointercancel=()=>fire();document.querySelector('#reset').onclick=()=>init();document.querySelector('#snd').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊 音效':'🔇 静音'};document.querySelector('#go').onclick=()=>{level++;score=0;init()};init();draw();</script></html>
