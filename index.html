<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>怒冲鸟 · Slingshot Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08111f;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}body{touch-action:none}#app{position:fixed;inset:0;background:radial-gradient(circle at 50% 10%,#203c5c 0,#0b1627 52%,#050a12 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(1180px,calc(100% - 24px));display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}.brand,.pill,.btn{backdrop-filter:blur(18px);background:rgba(7,15,28,.58);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 35px rgba(0,0,0,.2)}.brand{padding:10px 15px;border-radius:17px}.brand b{font-size:16px;letter-spacing:.5px}.brand span{display:block;font-size:10px;color:#91a6bd;margin-top:2px}.stats{display:flex;gap:8px}.pill{padding:8px 12px;border-radius:14px;text-align:center;min-width:68px}.pill small{display:block;color:#8ea3b9;font-size:9px}.pill strong{font-size:15px}.controls{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px}.btn{pointer-events:auto;color:#dcecff;border-radius:14px;padding:10px 13px;font-weight:700;cursor:pointer}.btn:hover{background:rgba(30,55,82,.75)}#tip{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:rgba(5,12,22,.48);border:1px solid rgba(255,255,255,.1);color:#a9bbce;font-size:12px;pointer-events:none;transition:.4s}.modal{position:absolute;inset:0;display:grid;place-items:center;background:rgba(2,6,12,.56);backdrop-filter:blur(9px);opacity:0;pointer-events:none;transition:.25s}.modal.show{opacity:1;pointer-events:auto}.card{width:min(430px,calc(100% - 30px));padding:28px;border-radius:28px;background:linear-gradient(145deg,rgba(22,39,60,.95),rgba(8,16,29,.96));border:1px solid rgba(255,255,255,.13);box-shadow:0 35px 100px #0009;text-align:center}.card h1{margin:0 0 8px;font-size:30px}.card p{color:#9fb2c7;line-height:1.6;margin:8px 0 22px}.primary{width:100%;padding:13px;border:0;border-radius:15px;background:#ffca55;color:#1b170c;font-weight:900;font-size:15px;cursor:pointer}.stars{font-size:25px;letter-spacing:7px;margin:10px 0}
</style>
</head>
<body><div id="app"><canvas id="game"></canvas>
<div class="hud"><div class="brand"><b>⚡ 怒冲鸟 · SLINGSHOT LAB</b><span>原创物理弹射实验场</span></div><div class="stats"><div class="pill"><small>关卡</small><strong id="level">1</strong></div><div class="pill"><small>分数</small><strong id="score">0</strong></div><div class="pill"><small>剩余</small><strong id="ammo">3</strong></div></div></div>
<div class="controls"><button class="btn" id="reset">↻ 重来</button><button class="btn" id="sound">🔊 音效</button></div><div id="tip">拖拽弹弓 · 松手发射 · 撞得越狠分越高</div>
<div class="modal" id="modal"><div class="card"><div class="stars" id="stars">★★★</div><h1 id="resultTitle">漂亮！</h1><p id="resultText">目标全部清除。物理引擎表现良好。</p><button class="primary" id="next">继续挑战 →</button></div></div>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,2);function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const ui={level:document.getElementById('level'),score:document.getElementById('score'),ammo:document.getElementById('ammo'),tip:document.getElementById('tip'),modal:document.getElementById('modal'),stars:document.getElementById('stars'),title:document.getElementById('resultTitle'),text:document.getElementById('resultText')};
let level=1,score=0,ammo=3,running=true,drag=false,mouse={x:0,y:0},shot=null,blocks=[],targets=[],particles=[],shake=0,soundOn=true;
const levels=[
{wind:.02,blocks:[[.69,.66,.16,.055,1],[.82,.58,.055,.14,1],[.91,.70,.055,.11,2],[.77,.47,.055,.12,2]],targets:[[.74,.59,.025],[.89,.61,.025]]},
{wind:-.015,blocks:[[.67,.68,.18,.055,2],[.76,.57,.055,.18,1],[.87,.68,.16,.055,1],[.94,.57,.055,.17,2],[.84,.45,.12,.05,2]],targets:[[.73,.61,.025],[.90,.60,.025],[.84,.39,.025]]},
{wind:.028,blocks:[[.62,.70,.13,.055,1],[.72,.60,.055,.22,2],[.83,.70,.20,.055,2],[.93,.60,.055,.22,1],[.82,.48,.16,.055,2],[.88,.39,.055,.12,1]],targets:[[.68,.64,.025],[.88,.64,.025],[.85,.43,.025],[.93,.52,.025]]}
];
function groundY(){return H-Math.max(62,H*.13)}function sling(){return{x:W*.18,y:groundY()-95}}
function loadLevel(){blocks=[];targets=[];particles=[];shot=null;drag=false;running=true;ammo=3;ui.ammo.textContent=ammo;ui.level.textContent=level;ui.modal.classList.remove('show');const L=levels[(level-1)%levels.length];L.blocks.forEach(a=>blocks.push({x:a[0]*W,y:groundY()-a[1]*H,w:a[2]*W,h:a[3]*H,hp:a[4],max:a[4],dead:false}));L.targets.forEach(a=>targets.push({x:a[0]*W,y:groundY()-a[1]*H,r:a[2]*W,dead:false}));}
function play(freq=220,dur=.06,type='sine'){if(!soundOn)return;try{let ac=window.audioCtx||(window.audioCtx=new AudioContext()),o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}}
function burst(x,y,n=14){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,r:2+Math.random()*3})}}
function circleRect(x,y,r,b){let px=Math.max(b.x-b.w/2,Math.min(x,b.x+b.w/2)),py=Math.max(b.y-b.h/2,Math.min(y,b.y+b.h/2));return (x-px)**2+(y-py)**2<r*r}
function shoot(){if(ammo<=0||shot)return;let s=sling(),dx=s.x-mouse.x,dy=s.y-mouse.y,len=Math.hypot(dx,dy),power=Math.min(len,155);let k=power/155;shot={x:s.x,y:s.y,vx:(dx/(len||1))*k*15,vy:(dy/(len||1))*k*15,r:19,trail:[],sleep:0};ammo--;ui.ammo.textContent=ammo;play(150,.12,'triangle');drag=false;ui.tip.style.opacity=.25}
function collide(){if(!shot)return;for(const b of blocks){if(b.dead)continue;if(circleRect(shot.x,shot.y,shot.r,b)){let impact=Math.hypot(shot.vx,shot.vy);b.hp-=impact>7?2:1;shot.vx*=-.52;shot.vy*=-.52;shot.x+=(shot.vx>0?1:-1)*4;burst(shot.x,shot.y,8);shake=Math.min(12,impact*.35);score+=Math.round(impact*8);play(90+Math.min(220,impact*8),.08,'square');if(b.hp<=0){b.dead=true;score+=250;burst(b.x,b.y,25);shake=13;play(75,.18,'sawtooth')}}}
for(const t of targets){if(t.dead)continue;if(Math.hypot(shot.x-t.x,shot.y-t.y)<shot.r+t.r){t.dead=true;score+=500;burst(t.x,t.y,32);shake=16;play(420,.16,'square')}}
}
function update(){if(!running)return;let gy=groundY();if(shot){shot.trail.push({x:shot.x,y:shot.y});if(shot.trail.length>20)shot.trail.shift();shot.vy+=.42;shot.vx+=levels[(level-1)%levels.length].wind;shot.x+=shot.vx;shot.y+=shot.vy;shot.vx*=.997;shot.vy*=.998;collide();if(shot.y+shot.r>gy){shot.y=gy-shot.r;shot.vy*=-.45;shot.vx*=.72;shot.sleep++;}if(shot.x>W+80||shot.y>H+100||shot.sleep>45||Math.hypot(shot.vx,shot.vy)<.45&&shot.sleep>10){shot=null;if(ammo<=0&&targets.some(t=>!t.dead))setTimeout(end,false?0:700)}}
for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=.025}particles=particles.filter(p=>p.life>0);shake*=.86;ui.score.textContent=score;checkWin()}
function checkWin(){if(targets.length&&targets.every(t=>t.dead)){running=false;let st=ammo>=2?'★★★':ammo===1?'★★☆':'★☆☆';ui.stars.textContent=st;ui.title.textContent='关卡清除！';ui.text.textContent=`本关得分 ${score.toLocaleString()} · 剩余弹药 ${ammo}`;setTimeout(()=>ui.modal.classList.add('show'),500)}}
function end(){if(running&&ammo<=0&&!targets.every(t=>t.dead)){running=false;ui.stars.textContent='—';ui.title.textContent='弹药耗尽';ui.text.textContent='别急，调整角度和力度，再来一次。';setTimeout(()=>ui.modal.classList.add('show'),250)}}
function draw(){ctx.clearRect(0,0,W,H);let sy=shake?(Math.random()-.5)*shake:0,sx=shake?(Math.random()-.5)*shake:0;ctx.save();ctx.translate(sx,sy);let gy=groundY();let g=ctx.createLinearGradient(0,0,0,gy);g.addColorStop(0,'#122944');g.addColorStop(1,'#0b1727');ctx.fillStyle=g;ctx.fillRect(0,0,W,gy);ctx.fillStyle='#102b30';ctx.fillRect(0,gy,W,H-gy);ctx.fillStyle='rgba(255,255,255,.04)';for(let x=0;x<W;x+=42)ctx.fillRect(x,gy,1,H-gy);
// moon / clouds
ctx.fillStyle='rgba(255,255,255,.08)';ctx.beginPath();ctx.arc(W*.82,H*.17,42,0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse((i*190+W*.04)%(W+200)-100,H*(.17+i%2*.08),70,15,0,0,Math.PI*2);ctx.fill()}
// sling
let s=sling();ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle='#7a4a2a';ctx.beginPath();ctx.moveTo(s.x-12,gy);ctx.lineTo(s.x-4,s.y-8);ctx.moveTo(s.x+15,gy);ctx.lineTo(s.x+4,s.y-8);ctx.stroke();if(drag){ctx.strokeStyle='#c9854c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(s.x-4,s.y-8);ctx.lineTo(mouse.x,mouse.y);ctx.lineTo(s.x+4,s.y-8);ctx.stroke();for(let i=1;i<10;i++){let t=i*.09;let vx=(s.x-mouse.x)*Math.min(Math.hypot(s.x-mouse.x, s.y-mouse.y)/155,1)*15;let vy=(s.y-mouse.y)*Math.min(Math.hypot(s.x-mouse.x, s.y-mouse.y)/155,1)*15;let px=s.x+vx*t,py=s.y+vy*t+.21*t*t*60;ctx.fillStyle=`rgba(255,255,255,${.55-i*.045})`;ctx.beginPath();ctx.arc(px,py,2.5,0,Math.PI*2);ctx.fill()}}
// blocks
for(const b of blocks){if(b.dead)continue;ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.sin(b.x)*.005);let r=10;ctx.fillStyle=b.max===2?'#8c5b3d':'#a76d43';roundRect(-b.w/2,-b.h/2,b.w,b.h,r);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.15)';ctx.stroke();ctx.strokeStyle='rgba(35,20,12,.35)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-b.w*.3,-b.h*.2);ctx.lineTo(b.w*.1,b.h*.25);ctx.moveTo(b.w*.15,-b.h*.25);ctx.lineTo(b.w*.35,b.h*.1);ctx.stroke();ctx.restore()}
// targets
for(const t of targets){if(t.dead)continue;ctx.fillStyle='#9be15d';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17210e';ctx.beginPath();ctx.arc(t.x-t.r*.35,t.y-t.r*.1,t.r*.13,0,Math.PI*2);ctx.arc(t.x+t.r*.35,t.y-t.r*.1,t.r*.13,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#2e4e22';ctx.lineWidth=3;ctx.stroke()}
// projectile trail and bird
if(shot){for(let i=0;i<shot.trail.length;i++){let p=shot.trail[i];ctx.fillStyle=`rgba(255,205,85,${i/shot.trail.length*.3})`;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill()}drawBird(shot.x,shot.y,shot.r)}else if(ammo>0)drawBird(s.x,s.y,19);
for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}ctx.restore();requestAnimationFrame(()=>{update();draw()})}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawBird(x,y,r){let ang=shot?Math.atan2(shot.vy,shot.vx):0;ctx.save();ctx.translate(x,y);ctx.rotate(Math.max(-.45,Math.min(.45,ang)));ctx.fillStyle='#ff5d4f';ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe7d0';ctx.beginPath();ctx.arc(0,r*.42,r*.55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-r*.35,-r*.2,r*.25,r*.32,0,0,Math.PI*2);ctx.ellipse(r*.35,-r*.2,r*.25,r*.32,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(-r*.35,-r*.18,r*.1,0,Math.PI*2);ctx.arc(r*.35,-r*.18,r*.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffc247';ctx.beginPath();ctx.moveTo(-r*.05,-r*.03);ctx.lineTo(r*.55,r*.08);ctx.lineTo(-r*.05,r*.2);ctx.closePath();ctx.fill();ctx.strokeStyle='#321d20';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-r*.62,-r*.48);ctx.lineTo(-r*.08,-r*.38);ctx.moveTo(r*.08,-r*.38);ctx.lineTo(r*.62,-r*.48);ctx.stroke();ctx.restore()}
function pos(e){let q=e.touches?e.touches[0]:e;mouse.x=q.clientX;mouse.y=q.clientY}
function down(e){pos(e);let s=sling();if(ammo>0&&!shot&&Math.hypot(mouse.x-s.x,mouse.y-s.y)<55){drag=true;play(180,.03)}}function move(e){if(drag){e.preventDefault();pos(e);let s=sling(),dx=mouse.x-s.x,dy=mouse.y-s.y,l=Math.hypot(dx,dy),max=155;if(l>max){mouse.x=s.x+dx/l*max;mouse.y=s.y+dy/l*max}}}function up(e){if(drag){pos(e);shoot()}}
c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
document.getElementById('reset').onclick=()=>{loadLevel();ui.tip.style.opacity=1};document.getElementById('sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊 音效':'🔇 静音'};document.getElementById('next').onclick=()=>{if(targets.every(t=>t.dead)){level++;score=0;loadLevel()}else loadLevel()};
loadLevel();draw();
</script></body></html>
